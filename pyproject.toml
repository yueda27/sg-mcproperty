[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-mcproperty"
version = "0.1.0"
description = "MCP on Singapore property transaction data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yue Da, Chua", email = "chua_yueda@hotmail.com" }
]
dependencies = [
    "fastmcp",
    "clickhouse-connect",
    "polars",
    "requests",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pandas>=3.1.1",
    "pytest",
    "ruff",
]

[project.scripts]
sg-property-migrate = "sg_mcproperty.migrate:main"
sg-property-load = "sg_mcproperty.loaders.cli:main"
sg-property-mcp = "sg_mcproperty.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
